server {
    listen ${PORT};
    server_name localhost;

    # Railway's internal DNS server (fixed address, same for every project).
    # Combined with the variable in proxy_pass below, this defers upstream
    # resolution to request time, so nginx starts even when the backend is
    # unavailable and re-resolves after the backend redeploys (its private IP
    # changes each deploy). valid=1s keeps the cached record fresh.
    resolver [fd12::10] ipv6=on valid=1s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Using a variable forces per-request DNS resolution via the resolver
        # above. $request_uri preserves the full "/api/..." path (the backend
        # routes are mounted under /api), including the query string.
        set $backend "${BACKEND_URL}";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
